name: antiphishing-local
services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama@sha256:dea72d1e22270fe095b68fdf756d2b489d615643c5a2eaebbc5f569181e322d8}
    environment:
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
    volumes:
      - models:/root/.ollama
    ports:
      - '127.0.0.1:11434:11434'
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  analyzer:
    build: .
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      AI_TIMEOUT: ${AI_TIMEOUT:-120}
      REPUTATION_HASHES: ${REPUTATION_HASHES:-0}
      REPUTATION_URLS: ${REPUTATION_URLS:-0}
      VT_API_KEY: ${VT_API_KEY:-}
      GSB_API_KEY: ${GSB_API_KEY:-}
    volumes:
      - ./samples:/app/samples:ro
      - ./results:/app/results
    depends_on:
      ollama:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    command: ['python', '-m', 'antiphishing', '--batch', 'samples', '--output', 'results/real']
volumes:
  models:
